name: TV Channel Availability
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  check-official-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test status classification
        run: python -m unittest discover -s tests -p 'test_tv_channel_availability.py' -v
      - name: Check official viewing pages
        run: python scripts/check_tv_channel_availability.py
      - uses: actions/upload-artifact@v4
        with:
          name: miltvplus-tv-availability-report
          path: artifacts/tv-channel-availability.json
          if-no-files-found: error
