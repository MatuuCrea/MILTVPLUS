name: TV Channel Availability
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - 'scripts/check_tv_channel_availability.py'
      - 'tests/test_tv_channel_availability.py'
      - 'data/catalog/argentina-channel-inventory.json'
      - 'data/catalog/international-channel-inventory.json'
      - 'data/catalog/argentina-public-channel-audit.json'
      - 'docs/INSTALL-TEST-GUIDE.md'
      - 'tests/test_argentina_public_channel_audit.py'
      - 'docs/GLOBAL-TV-CATALOG.md'
      - 'docs/PLAYBACK-AND-SCALING.md'
      - '.github/workflows/tv-channel-availability.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test status classification
        run: python -m unittest discover -s tests -p 'test_*.py' -v
  check-official-pages:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official viewing pages
        run: python scripts/check_tv_channel_availability.py
      - uses: actions/upload-artifact@v4
        with:
          name: miltvplus-tv-availability-report
          path: artifacts/tv-channel-availability.json
          if-no-files-found: error
