name: Smart TV Clients
on:
  push:
    branches: [main]
    paths: ['platforms/tizen/**', 'platforms/webos/**', 'platforms/shared/**', 'scripts/package-smart-tvs.sh', 'scripts/tv-signing.env.example', 'tests/test_smart_tv_clients.py', 'tests/test_tv_packaging.py', '.github/workflows/smart-tv-clients.yml']
  pull_request:
    branches: [main]
    paths: ['platforms/tizen/**', 'platforms/webos/**', 'platforms/shared/**', 'scripts/package-smart-tvs.sh', 'scripts/tv-signing.env.example', 'tests/test_smart_tv_clients.py', 'tests/test_tv_packaging.py', '.github/workflows/smart-tv-clients.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smart-tv-clients-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  validate-native-tv-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check platforms/tizen/app.js
          node --check platforms/webos/app.js
          node --check platforms/shared/media-manager.js
          node --check platforms/shared/music-experience.js
          node --check platforms/shared/official-interface.js
      - name: Validate manifests, catalog separation and packaging safeguards
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate packaging script syntax
        run: bash -n scripts/package-smart-tvs.sh
