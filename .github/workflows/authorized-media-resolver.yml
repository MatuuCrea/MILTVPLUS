name: Authorized Media Resolver
on:
  push:
    branches: [main]
    paths:
      - "backend/resolver/**"
      - "supabase/migrations/**"
      - ".github/workflows/authorized-media-resolver.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/resolver/**"
      - "supabase/migrations/**"
      - ".github/workflows/authorized-media-resolver.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: authorized-media-resolver-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  test-resolver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/resolver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run rights and resolver tests
        run: npm test
