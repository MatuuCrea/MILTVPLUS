name: Native installers
on:
  push:
    tags:
      - 'v*'
    branches:
      - 'build/installers'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión numérica de MILTVPLUS (ej. 22.34.10)'
        required: true
        default: '22.34.10'
permissions:
  contents: write
jobs:
  android:
    name: Build signed Android release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Validate protected Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required protected secret: $name"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/miltvplus-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Run JVM tests and build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="22.34.10"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::La versión debe ser numérica, por ejemplo 22.34.10"
            exit 1
          fi
          gradle :app:testDebugUnitTest
          gradle -PappVersionName="$VERSION" :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/MILTVPLUS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MILTVPLUS-Android
          path: app/build/outputs/apk/release/MILTVPLUS.apk
          if-no-files-found: error
  windows:
    name: Build native Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Set Windows release version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } elseif ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            $version = "22.34.10"
          }
          if ($version -notmatch '^\d+\.\d+(\.\d+)?$') { throw "La versión debe ser numérica, por ejemplo 22.34.10" }
          "MILTVPLUS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Generate Windows icon
        shell: pwsh
        run: ./windows/scripts/prepare-icon.ps1
      - name: Publish native Windows app
        shell: pwsh
        run: |
          $version = $env:MILTVPLUS_VERSION
          $assemblyVersion = "$version.0"
          dotnet publish windows/MILTVPLUS.Desktop/MILTVPLUS.Desktop.csproj -c Release -r win-x64 --self-contained true "-p:Version=$version" "-p:AssemblyVersion=$assemblyVersion" "-p:FileVersion=$assemblyVersion" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o windows/publish
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: iscc "/DAppVersion=$env:MILTVPLUS_VERSION" windows/installer/MILTVPLUS.iss
      - uses: actions/upload-artifact@v4
        with:
          name: MILTVPLUS-Windows
          path: dist/MILTVPLUS-Setup-x64.exe
          if-no-files-found: error
  publish:
    name: Attach verified platform installers to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'MILTVPLUS-*'
          merge-multiple: true
          path: release-assets
      - name: Generate SHA-256 manifest
        run: cd release-assets && sha256sum MILTVPLUS.apk MILTVPLUS-Setup-x64.exe > SHA256SUMS
      - name: Publish signed APK, Windows installer and checksums
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/MILTVPLUS.apk
            release-assets/MILTVPLUS-Setup-x64.exe
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
