name: Native installers
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  android:
    name: Build Android APK (debug-signed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest
      - name: Build installable APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  windows:
    name: Build native Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generate Windows icon
        shell: pwsh
        run: ./windows/scripts/prepare-icon.ps1
      - name: Publish native Windows app
        run: dotnet publish windows/MILTVPLUS.Desktop/MILTVPLUS.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o windows/publish
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc windows/installer/MILTVPLUS.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/MILTVPLUS-Setup-x64.exe
          if-no-files-found: error
  publish:
    name: Attach direct installer files to GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: release-assets
      - name: Publish APK and EXE as direct release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/app-debug.apk
            release-assets/MILTVPLUS-Setup-x64.exe
          fail_on_unmatched_files: true
